name: Failure investigation demo
run-name: Intentional payment test failure for the live demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out demo source
        uses: actions/checkout@v7

      - name: Run demo tests
        working-directory: demos/payment_failure
        run: |
          python3 -m unittest -v test_payment_service
